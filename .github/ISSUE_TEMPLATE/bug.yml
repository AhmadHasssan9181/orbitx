name: Bug report for the OrbitX Android app
description: Report any issues that you have found with the OrbitX Android App.
labels: [T-Defect]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Please attach screenshots, videos or logs if you can.
      placeholder: Tell us what you see!
      value: |
        1. Where are you starting? What can you see?
        2. What do you click?
        3. More steps…
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Outcome
      placeholder: Tell us what went wrong
      value: |
        #### What did you expect?

        #### What happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your phone model
      placeholder: e.g. Pixel 8 / Samsung S24
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: e.g. Android 14
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: e.g. OrbitX version 1.0.0
    validations:
      required: false
  - type: input
    id: homeserver
    attributes:
      label: Homeserver
      description: |
        Which server is your account registered on?
      placeholder: e.g. orbitweb.tech
    validations:
      required: false
  - type: dropdown
    id: pr
    attributes:
      label: Are you willing to provide a PR?
      options:
        - 'Yes'
        - 'No'
    validations:
      required: true
