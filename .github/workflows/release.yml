name: OrbitX Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or release version (e.g. v26.10.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx7g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError" -Dkotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Increase swapfile size
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo swapon --show

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build F-Droid (Sovereign FOSS) Release APKs
        run: ./gradlew :app:assembleFdroidRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Build Google Play Release APKs
        run: ./gradlew :app:assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Build Google Play Release App Bundle (AAB)
        run: ./gradlew :app:bundleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Package & Standardize Release Assets
        id: package
        run: |
          mkdir -p release-artifacts

          # Determine tag name
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "master" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v26.10.0')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Copy F-Droid release APKs (ARM64 & Universal)
          if [ -f app/build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release.apk release-artifacts/orbitx-${TAG}-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/fdroid/release/app-fdroid-universal-release.apk ]; then
            cp app/build/outputs/apk/fdroid/release/app-fdroid-universal-release.apk release-artifacts/orbitx-${TAG}-universal.apk
          fi

          # Copy GPlay release APKs & Bundle
          if [ -f app/build/outputs/apk/gplay/release/app-gplay-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/gplay/release/app-gplay-arm64-v8a-release.apk release-artifacts/orbitx-${TAG}-gplay-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/gplay/release/app-gplay-universal-release.apk ]; then
            cp app/build/outputs/apk/gplay/release/app-gplay-universal-release.apk release-artifacts/orbitx-${TAG}-gplay-universal.apk
          fi
          if [ -f app/build/outputs/bundle/gplayRelease/app-gplay-release.aab ]; then
            cp app/build/outputs/bundle/gplayRelease/app-gplay-release.aab release-artifacts/orbitx-${TAG}-bundle.aab
          fi

          echo "Generated release assets:"
          ls -la release-artifacts

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbitx-release-artifacts
          path: release-artifacts/*

      - name: Publish Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          echo "Publishing release assets for $TAG..."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "OrbitX $TAG" --generate-notes
          fi

          gh release upload "$TAG" release-artifacts/* --clobber
