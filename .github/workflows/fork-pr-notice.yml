name: Community PR notice

on:
  workflow_dispatch:
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: Welcome comment
    if: github.event.pull_request.base.repo.full_name != github.event.pull_request.head.repo.full_name
    steps:
      - name: Add auto-generated commit warning
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thank you for your contribution to OrbitX! Here are a few things to check:

              - If your pull request adds a feature or modifies the UI, please ensure that it aligns with the Orbit product direction and has been discussed in an issue first.
              - Your branch should be based on \`origin/master\`.
              - The title of the PR will be used for release notes, so it needs to describe the change clearly.
              - The tests pass locally running \`./gradlew testDebugUnitTest\`.
              - The code quality checks pass locally running \`./gradlew ktlintCheck detekt\`.`
            })
