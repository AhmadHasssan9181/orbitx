name: OrbitX CI Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build & Verify APKs
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Debug APKs
        run: ./gradlew :app:assembleGplayDebug :app:assembleFdroidDebug $CI_GRADLE_ARG_PROPERTIES

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: orbitx-debug-apks
          path: |
            app/build/outputs/apk/gplay/debug/*-universal-debug.apk
            app/build/outputs/apk/fdroid/debug/*-universal-debug.apk
            app/build/outputs/apk/fdroid/debug/*-arm64-v8a-debug.apk

      - name: Verify Release Compilation
        run: ./gradlew :app:compileFdroidReleaseKotlin :app:compileGplayReleaseKotlin $CI_GRADLE_ARG_PROPERTIES
